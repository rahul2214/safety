<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brand_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#6d4aff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="shield_tint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d4aff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.08" />
    </linearGradient>
    <filter id="brand_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6d4aff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circle Boundary -->
  <circle cx="50" cy="50" r="46" stroke="url(#brand_grad)" stroke-width="3" stroke-opacity="0.95" filter="url(#brand_glow)" />

  <!-- Base Protective Shield -->
  <path d="M50 18 L76 28 C76 54 64 72 50 82 C36 72 24 54 24 28 Z" fill="url(#shield_tint)" stroke="url(#brand_grad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Left Wing -->
  <path d="M50 48 C42 36 28 35 24 45 C22 55 32 66 42 70 C46 66 48 58 50 48 Z" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M48 55 C40 46 32 46 28 53 C27 59 34 66 42 68" fill="none" stroke="#10b981" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Right Wing -->
  <path d="M50 48 C58 36 72 35 76 45 C78 55 68 66 58 70 C54 66 52 58 50 48 Z" fill="none" stroke="#6d4aff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 55 C60 46 68 46 72 53 C73 59 66 66 58 68" fill="none" stroke="#6d4aff" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Center Lotus Bloom -->
  <path d="M50 26 C46 34 46 44 50 54 C54 44 54 34 50 26 Z" fill="url(#brand_grad)" />
  <path d="M47 34 C40 37 36 44 42 50 C46 45 47 39 47 34 Z" fill="#10b981" fill-opacity="0.9" />
  <path d="M53 34 C60 37 64 44 58 50 C54 45 53 39 53 34 Z" fill="#8b5cf6" fill-opacity="0.9" />

  <!-- Core Beacon of Hope -->
  <circle cx="50" cy="46" r="3.5" fill="#ffffff" stroke="#6d4aff" stroke-width="1" />
</svg>
